name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Release APK
        if: github.event.inputs.build_type == 'release' || github.event.inputs.build_type == ''
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build Debug APK
        if: github.event.inputs.build_type == 'debug'
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK to Release
        if: github.event.inputs.build_type == 'release' || github.event.inputs.build_type == ''
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          tag_name: "v2.2.0"
          name: "Die Bilanz der Republik v2.2.0"
          body: |
            Android APK - Die Bilanz der Republik

            Features:
            - 51 interaktive SVG-Charts
            - Geschichte 1981–2026
            - Steuerrechner, EU-Vergleich, Inflationsrechner
            - Offline-fähig via Service Worker
            - 6 Themes
            - Terminologie-Farbkodierung

            Mindestens Android API 24 erforderlich.
          draft: false
          prerelease: false

      - name: Upload Debug APK
        if: github.event.inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: List APKs
        run: find android/app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
